services:
  - type: web
    name: tabupulse-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TABPFN_API_KEY
        sync: false
    autoDeploy: true
